<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tunnel Vision PDF Reader</title>
  <script src="/src/pdf-reader.ts" type="module" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/pdfjs-dist@4.10.38/web/pdf_viewer.css">
  <style>
    h1 {
      font-family: serif;
    }

    body {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: space-around;
    }

    #sidebar {
      display: flex;
      flex-direction: column;
      align-items: center
    }

    body>div {
      margin: 1ch;
    }

    main {
      border: black;
      border-style: solid;
    }
  </style>
</head>

<body>

  <div id="sidebar">
    <h1>Tunnel Vision PDF Reader</h1>
    <div>
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
    <div>
      <span>Page: <span id="page_num"></span> / <span id="page_count"></span></span>
    </div>
  </div>

  <main>
    <canvas id="the-canvas"></canvas>
    <div id="text-layer" class="textLayer"></div>
  </main>

</body>

</html>
