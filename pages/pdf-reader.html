<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tunnel Vision PDF Reader</title>
  <script src="/src/pdf-reader.ts" type="module" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/pdfjs-dist@4.10.38/web/pdf_viewer.css">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>

  <div id="sidebar">
    <h1 class="text-3x1 font-bold underline">Tunnel Vision PDF Reader</h1>
    <div>
      <button id="prev">Previous</button>
      <button id="next">Next</button>
    </div>
    <div>
      <span>Page: <span id="page_num"></span> / <span id="page_count"></span></span>
    </div>
    <div id="debug-panel">
      <h2>Debug Panel</h2>
      <button id="re-range">Re-Range</button>
    </div>
  </div>

  <!-- TODO: Make this zoomable -->
  <main>
    <canvas id="the-canvas"></canvas>
    <div id="text-layer" class="textLayer"></div>
  </main>

</body>

</html>
